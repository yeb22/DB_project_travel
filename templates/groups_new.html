<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>그룹 추가</title>
</head>
<body>
  <h1>그룹 추가</h1>

  <form action="/groups/create/" method="post">
    <p>
      그룹 이름: <input type="text" name="gName" required>
    </p>
    <p>
      1인당 예산: <input type="number" name="budget" min="0">

    <p>

    </p>
    <button type="submit">저장</button>
  </form>

  <p><a href="/groups/">그룹 목록으로</a></p>
</body>
</html>
