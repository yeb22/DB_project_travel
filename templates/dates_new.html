<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>가능 날짜 추가</title>
   <style>
  html{
      font-size: 25px;
    }
  body{
    text-align: center;
  }
  ul{
    list-style-position: inside;
    padding: 0;
    text-align: center;
  }
  button {   
  padding: 1px 4px;     
  margin-left: 6px;
  background-color:rgb(255, 255, 255);
  border: 1px solid #29abc2;
  border-radius: 6px;
  }
  input{
    background-color: white;
    border:1.5px solid #29abc2;
  }
  select{
    background-color: white;
    border:1.5px solid #29abc2;
  }
  .mycolor{
    color: #29abc2;
  }
</style>
</head>
<body>
  <h1>가능 날짜 추가</h1>

  <form action="/dates/create/" method="post">
  {% if gID %}
    <input type="hidden" name="next_url" value="/groups/{{ gID }}/dates/">
  {% endif %}
    <p>
      사용자 선택:
      <select name="uID" required>
        {% for u in users %}
          <option value="{{ u['uID'] }}">
            {{ u['uName'] }}
          </option>
        {% endfor %}
      </select>
    </p>

    <p>
      날짜:
      <input type="date" name="date" required>
    </p>

    <button type="submit">저장</button>
  </form>

  {% if gID %}
  <p><a href="/groups/{{ gID }}/dates/"class="mycolor">← 그룹 날짜로 돌아가기</a></p>
  {% else %}
  <p><a href="/dates/">날짜 목록으로</a></p>
  {% endif %}

</body>
</html>
